# Step 2b — join the ERA5-side power companion onto the ERA5 weather, dropping the stale
# power/turbine vars. Produces the OUTER dataset for the cutout.
#
#   anemoi-datasets create power_era5_join.yaml \
#     /mnt/weatherloss/WindPower/data/Wpower/Anemoidatasets/power_era5_A.zarr
# (name must match system.input.dataset.outer in the training config)
dates:
  start: "2015-01-01T00:00:00"
  end:   "2025-07-31T21:00:00"
  frequency: 3h

build:
  group_by: daily

input:
  join:
    - anemoi-dataset:
        dataset: /mnt/weatherloss/WindPower/data/WindAI/Anemoidatasets/era5_A_large.zarr
        drop: [power, capacity, turbinecount, turbinemask]
    - anemoi-dataset:
        dataset: /mnt/weatherloss/WindPower/data/WPDistr/Anemoidatasets/poweronly_era5.zarr
statistics:
    start: "2020-01-01T00:00:00"
    end:   "2023-12-31T21:00:00"
    allow_nans: [power, capacityfactor, capacity, turbinecount, turbmask]
