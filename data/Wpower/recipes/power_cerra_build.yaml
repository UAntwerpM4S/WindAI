# Step 1a — wrap the power source grid (already on the New_Cerra_A_large grid, written by
# build_power.py in New_Cerra cell order) into an anemoi dataset.
#
#   anemoi-datasets create power_cerra_build.yaml \
#     /mnt/weatherloss/WindPower/data/Wpower/Anemoidatasets/power_cerra.zarr
#
# Variables:
#   power           MW, time-varying  -- NaN where unobserved (pre-2020, out-of-window, shared-cell)
#   capacityfactor  power/capacity in [0,1], time-varying  -- NaN where unobserved  (the target)
#   capacity        MW nameplate, STATIC  -- finite at farm cells for ALL times     (a forcing)
#   turbinecount    turbines per cell, STATIC                                        (a forcing)
#   turbmask        1 at farm cells, STATIC                                          (the mask)
# All five are NaN at the 72,496 off-farm cells, so allow_nans lists all of them.
description: distributed power target (+ forcings + mask) on the New_Cerra grid
allow_nans: true

# Full weather record: the target is simply NaN before the power data starts (~2020), which the
# loss ignores via nan_mask_weights. Keeps the extra years of weather for the shared backbone.
dates:
  start: "2015-01-01T00:00:00"
  end:   "2025-07-31T21:00:00"
  frequency: 3h

build:
  group_by: daily

input:
  pipe:
    - xarray-zarr:
        url: "/mnt/weatherloss/WindPower/data/Wpower/power_cerra_src.zarr"
        param: [power, capacityfactor, capacity, turbinecount, turbmask]
        flavour:
          levtype: sfc
          rules:
            time:      { name: time }
            latitude:  { name: latitude }
            longitude: { name: longitude }

statistics:
  allow_nans: [power, capacityfactor, capacity, turbinecount, turbmask]
