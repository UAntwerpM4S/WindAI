# Step 2a — join the power target (+ forcings + mask) onto the CERRA weather, dropping the stale
# VanillaPowerGT power/turbine vars. Produces the INNER dataset the training cutout points at.
#
#   anemoi-datasets create power_cerra_join.yaml \
#     /mnt/weatherloss/WindPower/data/Wpower/Anemoidatasets/power_cerra_A.zarr
# (name must match system.input.dataset.inner in the training config)
#
# No name clash: the base carries the OLD [power, capacity, turbinecount, turbinemask] which we
# drop; ours are [power, capacityfactor, capacity, turbinecount, turbmask] (note turbMASK vs the
# base's turbineMASK). The CERRA weather vars (ws100, t2m, u/v, ...) are kept.
dates:
  start: "2015-01-01T00:00:00"
  end:   "2025-07-31T21:00:00"
  frequency: 3h

build:
  group_by: daily

input:
  join:
    - anemoi-dataset:
        dataset: /mnt/weatherloss/WindPower/data/WindAI/Anemoidatasets/New_Cerra_A_large.zarr
        drop: [power, capacity, turbinecount, turbinemask]
    - anemoi-dataset:
        dataset: /mnt/weatherloss/WindPower/data/Wpower/Anemoidatasets/power_cerra.zarr

statistics:
  allow_nans: [power, capacityfactor, capacity, turbinecount, turbmask]
