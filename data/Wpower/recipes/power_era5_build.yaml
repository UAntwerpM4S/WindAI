# Step 1b — wrap the ERA5-side companion (farms projected onto the coarser era5_A_large grid)
# into an anemoi dataset. Needed so the training cutout's inner (CERRA) and outer (ERA5)
# datasets carry the same variable set.
#
#   anemoi-datasets create power_era5_build.yaml \
#     /mnt/weatherloss/WindPower/data/Wpower/Anemoidatasets/power_era5.zarr
#
# Same five variables as the CERRA side. The companion is not all-NaN (anemoi's statistics pass
# needs finite values): build_power.py sums the farms into their ERA5 cells with drop-NaN so the
# boundary stays finite whenever at least one underlying farm cell reports.
description: distributed power target (+ forcings + mask) on the era5_A_large grid
allow_nans: true

dates:
  start: "2015-01-01T00:00:00"
  end:   "2025-07-31T21:00:00"
  frequency: 3h

build:
  group_by: daily

input:
  pipe:
    - xarray-zarr:
        url: "/mnt/weatherloss/WindPower/data/Wpower/power_era5_src.zarr"
        param: [power, capacityfactor, capacity, turbinecount, turbmask]
        flavour:
          levtype: sfc
          rules:
            time:      { name: time }
            latitude:  { name: latitude }
            longitude: { name: longitude }

statistics:
  allow_nans: [power, capacityfactor, capacity, turbinecount, turbmask]
